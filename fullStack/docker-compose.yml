services:

  mongodb:
    image: mongo:4.4
    container_name: fitpocket-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fitpocket

  n8n:
    image: n8nio/n8n
    container_name: fitpocket-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=fitpocket123admin
      - WEBHOOK_URL=http://localhost:5678

volumes:
  mongo-data:
  n8n-data: